name: RDP

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  secure-rdp:
    runs-on: windows-latest
    # GitHub kisi bhi job ko 360 minute (6 ghante) se zyada chalne nahi deta.
    # 3600 invalid tha — is liye 360 rakha gaya hai.
    timeout-minutes: 360
    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          # (2>$null taake "rule nahi mili" wala shor step ko ganda na kare)
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          # For testing, allow any incoming connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # (Optional) Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)      # A-Z
              Lower   = [char[]](97..122)     # a-z
              Number  = [char[]](48..57)      # 0-9
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126)) # Special characters
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          # -UseBasicParsing zaroori hai: Windows PowerShell 5.1 me iske baghair
          # download aksar fail ho jata hai.
          try {
              Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing -ErrorAction Stop
          } catch {
              Write-Error "Tailscale download fail ho gaya ($tsUrl). Ho sakta hai version purana ho — tailscale.com se naya version number daal kar dobara chalao. Detail: $_"
              exit 1
          }
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          # Sab se common failure: secret banae baghair run kar dena. Ab seedha batayega.
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              Write-Error "TAILSCALE_AUTH_KEY secret nahi mila! Repo ke Settings > Secrets and variables > Actions me jaa kar 'TAILSCALE_AUTH_KEY' naam ka secret banao (value: Tailscale admin panel se auth key)."
              exit 1
          }

          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=gh-runner-$env:GITHUB_RUN_ID

          # Wait for Tailscale to assign an IP
          # (.Trim() zaroori hai — output me extra space/newline aa jata hai
          #  jis se agle step ka connection test fail ho jata tha)
          $tsIP = $null
          $retries = 0
          while ([string]::IsNullOrWhiteSpace($tsIP) -and $retries -lt 10) {
              $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 | Select-Object -First 1).Trim()
              Start-Sleep -Seconds 5
              $retries++
          }

          if ([string]::IsNullOrWhiteSpace($tsIP)) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          # RDP service restart ke foran baad port test fail ho sakta hai,
          # is liye retry loop lagaya gaya hai (6 koshish, 10 second waqfa)
          $ok = $false
          for ($i = 1; $i -le 6; $i++) {
              $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
              if ($testResult.TcpTestSucceeded) { $ok = $true; break }
              Write-Host "Koshish $i/6: RDP port abhi reachable nahi, 10 second baad dobara..."
              Start-Sleep -Seconds 10
          }
          if (-not $ok) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "$env:RDP_CREDS"
          Write-Host "=================="
          Write-Host ""

          # Keep runner active (GitHub max 360 min par job khud cancel kar dega)
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - workflow cancel karne par band ho jayega"
              Start-Sleep -Seconds 300
          }
