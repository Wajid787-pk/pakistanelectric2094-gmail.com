name: RDP

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  secure-rdp:
    runs-on: windows-latest
    # GitHub kisi bhi job ko 360 minute (6 ghante) se zyada chalne nahi deta.
    timeout-minutes: 360
    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          # Remote Desktop on, NLA off
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0 -Force
          # Firewall rule (purani ho to pehle hata do)
          netsh advfirewall firewall delete rule name='RDP-Tailscale' 2>$null
          netsh advfirewall firewall add rule name='RDP-Tailscale' dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Security
          $upper = [char[]](65..90)
          $lower = [char[]](97..122)
          $number = [char[]](48..57)
          $special = [char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126)
          $raw = @()
          $raw += $upper | Get-Random -Count 4
          $raw += $lower | Get-Random -Count 4
          $raw += $number | Get-Random -Count 4
          $raw += $special | Get-Random -Count 4
          $password = -join ($raw | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name 'RDP' -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group 'Administrators' -Member 'RDP'
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'RDP'
          $credLine = 'RDP_CREDS=User: RDP | Password: ' + $password
          $credLine >> $env:GITHUB_ENV
          if (-not (Get-LocalUser -Name 'RDP')) { Write-Error 'User creation failed'; exit 1 }

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $installerPath = Join-Path $env:TEMP 'tailscale.msi'
          # -UseBasicParsing zaroori hai: Windows PowerShell 5.1 me iske baghair download aksar fail hota hai
          try {
            Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing -ErrorAction Stop
          } catch {
            Write-Error ('Tailscale download fail ho gaya: ' + $_)
            exit 1
          }
          $msiArgs = @('/i', $installerPath, '/quiet', '/norestart')
          Start-Process -FilePath 'msiexec.exe' -ArgumentList $msiArgs -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          # Sab se common failure: secret banae baghair run kar dena. Ab seedha batayega.
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error 'TAILSCALE_AUTH_KEY secret nahi mila! Repo ke Settings > Secrets and variables > Actions me jaa kar TAILSCALE_AUTH_KEY naam ka secret banao.'
            exit 1
          }
          $tailExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          & $tailExe up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=gh-runner-$env:GITHUB_RUN_ID
          # Tailscale IP ka intezar (Trim zaroori hai - output me extra space/newline aa jata hai)
          $tsIP = $null
          $retries = 0
          while ([string]::IsNullOrWhiteSpace($tsIP) -and $retries -lt 10) {
            $tsIP = (& $tailExe ip -4 | Select-Object -First 1).Trim()
            Start-Sleep -Seconds 5
            $retries++
          }
          if ([string]::IsNullOrWhiteSpace($tsIP)) { Write-Error 'Tailscale IP not assigned.'; exit 1 }
          ('TAILSCALE_IP=' + $tsIP) >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host ('Tailscale IP: ' + $env:TAILSCALE_IP)
          # RDP service restart ke foran baad port test fail ho sakta hai, is liye retry loop (6 koshish, 10s waqfa)
          $ok = $false
          for ($i = 1; $i -le 6; $i++) {
            $r = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
            if ($r.TcpTestSucceeded) { $ok = $true; break }
            Write-Host ('Koshish ' + $i + '/6: RDP port abhi reachable nahi, 10 second baad dobara...')
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { Write-Error 'TCP connection to RDP port 3389 failed'; exit 1 }
          Write-Host 'TCP connectivity successful!'

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ''
          Write-Host '=== RDP ACCESS ==='
          Write-Host ('Address : ' + $env:TAILSCALE_IP)
          Write-Host $env:RDP_CREDS
          Write-Host '=================='
          Write-Host ''
          # Runner ko zinda rakho (GitHub 360 min par job khud cancel kar dega)
          while ($true) {
            Write-Host ('[' + (Get-Date) + '] RDP Active - workflow cancel karne par band ho jayega')
            Start-Sleep -Seconds 300
          }
